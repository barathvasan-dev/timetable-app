services:
  - type: web
    name: timetable-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: timetable
      - key: APP_ORIGINS
        sync: false
